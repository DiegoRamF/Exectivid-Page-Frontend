<div class="flex items-center p-4 bg-[rgb(228,216,180)] md:hidden">
  <button
    (click)="toggleSidebar()"
    class="p-1 mr-2"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M4 6h16M4 12h16M4 18h16"
      ></path>
    </svg>
  </button>
  <span class="text-[rgb(121,50,5)] text-4xl font-montserrat font-bold">Exectivid</span>
</div>

@if ( isSidebarOpen() ) {
  <div
    (click)="toggleSidebar()"
    class="fixed inset-0 z-40 bg-black/50 md:hidden"
  ></div>
}

<aside
  class="fixed inset-y-0 left-0 z-50 flex flex-col w-64 h-full bg-[rgb(228,216,180)] text-white
    transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
  [class.translate-x-0]="isSidebarOpen()"
  [class.-translate-x-full]="!isSidebarOpen()"
>

  <div class="flex items-center justify-between p-4">
    <span class="text-[rgb(121,50,5)] text-4xl font-montserrat font-bold md:block">Exectivid</span>
    <button
      (click)="toggleSidebar()"
      class="md:hidden p-1 text-gray-300 hover:text-white"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
      </svg>
    </button>
  </div>

  <nav class="flex-1 p-4 space-y-1 font-montserrat">

    <span class="text-[10px] font-bold tracking-widest text-[rgb(164,116,75)]">ÁLBUMES</span>

    @for (album of albumes(); track album.id) {
      <a
        [routerLink]="['album', album.slug]"
        routerLinkActive="border-r-3 border-b-3 bg-[rgba(189,175,133,0.62)]"
        class="flex items-center px-4 py-3 rounded-lg border-[rgb(121,50,5)]
          transition duration-200 text-sm group
          hover:bg-[rgba(189,175,133,0.62)]"
      >
        <span class="truncate text-[rgb(121,50,5)] text-md font-bold">{{ album.id }} - {{ album.name }}</span>
      </a>
    }
  </nav>

</aside>
