<div class="flex items-center justify-between p-4 bg-[rgb(228,216,180)] md:hidden">
  <div class="flex items-center">
    <button (click)="toggleSidebar()" class="p-1 mr-2 text-[rgb(121,50,5)]">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <a class="text-[rgb(121,50,5)] text-4xl font-montserrat font-black tracking-widest" routerLink="info">
      Exectivid
    </a>
  </div>
</div>

@if ( isSidebarOpen() ) {
  <div
    (click)="toggleSidebar()"
    class="fixed inset-0 z-40 bg-black/50 md:hidden"
  ></div>
}

<aside
  class="fixed inset-y-0 left-0 z-50 flex flex-col w-96 h-full bg-[rgb(228,216,180)] text-white
    transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
  [class.translate-x-0]="isSidebarOpen()"
  [class.-translate-x-full]="!isSidebarOpen()"
>

  <div class="flex items-center justify-between p-4">
    <div class="flex items-center gap-3">
      <a
        class="text-[rgb(121,50,5)] text-4xl font-montserrat font-black tracking-widest md:block"
        routerLink="info"
      >
        Exectivid
      </a>
    </div>
  </div>

  <nav class="flex-1 p-4 space-y-1 font-montserrat">

    <a
      routerLink="/home"
      routerLinkActive="border-r-3 border-b-3 bg-[rgba(189,175,133,0.62)]"
      class="flex items-center px-4 py-3 mb-6 rounded-lg border-[rgb(121,50,5)]
        transition duration-200 text-sm group
        hover:bg-[rgba(189,175,133,0.62)]"
    >
      <svg
        class="w-5 h-5 mr-3 text-[rgb(121,50,5)]"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
        ></path>
      </svg>
      <span class="truncate text-[rgb(121,50,5)] text-md font-bold">Inicio</span>
    </a>

    <span class="text-[10px] font-bold tracking-widest text-[rgb(164,116,75)] p-6 border-t border-[rgb(164,116,75)]/30">ÁLBUMES</span>

    @for (album of albumes(); track album.id) {
      <a
        [routerLink]="['album', album.slug]"
        routerLinkActive="border-r-3 border-b-3 bg-[rgba(189,175,133,0.62)]"
        class="flex items-center px-4 py-3 rounded-lg border-[rgb(121,50,5)]
          transition duration-200 text-sm group
          hover:bg-[rgba(189,175,133,0.62)]"
      >
        <span class="truncate text-[rgb(121,50,5)] text-md font-bold">{{ album.id }} - {{ album.name }}</span>
      </a>
    }
  </nav>

  <div class="p-6 border-t border-[rgb(164,116,75)]/30 bg-[rgba(189,175,133,0.2)]">
    <div class="space-y-4">

      <div>
        <p class="text-[10px] font-bold uppercase tracking-widest text-[rgb(164,116,75)] mb-1">
          Créditos
        </p>
        <p class="text-sm font-montserrat text-[rgb(121,50,5)] leading-tight">
          <span class="text-[10px] opacity-70">Desarrollado por</span>
          <br />
          <span class="font-bold">Lewy</span>
        </p>
      </div>

      <div class="space-y-2 mt-4 pt-4 border-t border-[rgb(164,116,75)]/20">
        <p class="text-[10px] font-bold uppercase tracking-widest text-[rgb(164,116,75)]">
          Sigue a Exectivid
        </p>
        <div class="flex gap-4">

            href="https://www.instagram.com/exectivid/"

          <a

          >

            >

            </svg>
          </a>
          <a

            target="_blank"

            <svg

              />
            </svg>
          </a>
        </div>
      </div>

      <p class="text-[9px] text-[rgb(121,50,5)]/60 italic mt-2">© 2026 Huancayo, Perú</p>
    </div>
  </div>

</aside>
