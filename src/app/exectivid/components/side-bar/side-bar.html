<div class="flex items-center p-4 bg-[rgb(228,216,180)] md:hidden">
  <button
    (click)="toggleSidebar()"
    class="p-1 mr-2"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M4 6h16M4 12h16M4 18h16"
      ></path>
    </svg>
  </button>
  <span class="text-[rgb(121,50,5)] text-4xl font-montserrat font-bold">Exectivid</span>
</div>

@if ( isSidebarOpen() ) {
  <div
    (click)="toggleSidebar()"
    class="fixed inset-0 z-40 bg-black/50 md:hidden"
  ></div>
}
